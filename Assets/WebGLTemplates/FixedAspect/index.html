<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #101010; color: white; font-family: sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #stage { position: relative; flex: none; background: black; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #171717; padding: 16px; }
    #controls { display: none; flex: none; height: 48px; gap: 8px; align-items: center; justify-content: center; }
    #controls button { color: white; background: #333; border: 1px solid #777; border-radius: 8px; padding: 8px 10px; font-size: 14px; min-height: 42px; touch-action: manipulation; }
    [hidden] { display: none !important; }
    @media (pointer: coarse) { #controls { display: flex; } }
  </style>
</head>
<body>
  <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas><div id="status">読み込み中…</div></div>
  <div id="controls" aria-label="ゲーム操作">
    <button id="menu" hidden>メニュー</button><button id="jump" hidden>ジャンプ</button><button id="sweep" hidden>一掃</button><button id="skip-catch" aria-label="キャッチゲームをスキップ" hidden>スキップ</button>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    let instance;
    function resize() {
      const style = getComputedStyle(document.body);
      const w = document.documentElement.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const h = document.documentElement.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom) - document.getElementById('controls').getBoundingClientRect().height;
      const width = Math.min(w, h * 16 / 9);
      stage.style.width = width + 'px'; stage.style.height = width * 9 / 16 + 'px';
    }
    window.addEventListener('resize', resize); resize();
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    window.setGameControls = state => {
      document.getElementById('menu').hidden = !(state & 1);
      document.getElementById('jump').hidden = !(state & 2);
      document.getElementById('sweep').hidden = !(state & 4);
      document.getElementById('skip-catch').hidden = !(state & 8);
    };
    for (const [id, action] of [['menu', 'ToggleMenu'], ['jump', 'Jump'], ['sweep', 'Sweep'], ['skip-catch', 'SkipCatch']]) {
      document.getElementById(id).addEventListener('click', () => {
        if (instance) instance.SendMessage('Browser Game Controls', action);
      });
    }
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = () => { status.textContent = '読み込みに失敗しました。ページを再読み込みしてください。'; };
    loader.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, progress => { status.textContent = '読み込み中… ' + Math.round(progress * 100) + '%'; })
      .then(game => { instance = game; status.hidden = true; canvas.focus(); })
      .catch(error => { status.textContent = '起動に失敗しました: ' + error; });
    document.body.appendChild(loader);
  </script>
</body>
</html>
